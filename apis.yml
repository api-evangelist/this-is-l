name: This Is L.
description: >-
  This Is L. (L. Inc.) is a personal-care company making certified-organic cotton
  menstrual products — tampons, pads, and liners — sold through major U.S. retailers
  including Target, Walmart, Walgreens, CVS, and Kroger as well as direct-to-consumer
  at thisisl.com. Founded as a social enterprise and public-benefit corporation with a
  one-for-one give-back model, L. was surfaced in the API Evangelist network as a
  portfolio company of 500 Global and is now a Procter & Gamble brand (its legal,
  privacy, and vulnerability-disclosure surfaces resolve to pg.com). This is a consumer
  packaged-goods e-commerce business with no public developer API, SDK, or technology
  platform; enrichment captured its identity, web link-properties, and security posture.
